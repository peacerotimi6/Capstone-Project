name: Build, Provision and Deploy

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  build-backend:
    name: Build and Push Backend Image
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.tag.outputs.image_tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Azure (for ACR access)
        if: vars.REGISTRY == 'acr'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: ACR login
        if: vars.REGISTRY == 'acr'
        run: |
          ACR_NAME=$(echo "${{ vars.BACKEND_REGISTRY_PATH }}" | cut -d/ -f1 | cut -d. -f1)
          az acr login --name "${ACR_NAME}"

      - name: Log in to Docker Hub
        if: vars.REGISTRY == 'dockerhub'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GHCR
        if: vars.REGISTRY == 'ghcr'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Generate backend image tag
        id: tag
        run: |
          IMAGE_TAG="${{ vars.BACKEND_REGISTRY_PATH }}:${{ github.sha }}"
          echo "image_tag=${IMAGE_TAG}" >> $GITHUB_OUTPUT

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.tag.outputs.image_tag }}
          platforms: linux/amd64


  build-frontend:
    name: Build and Push Frontend Image
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.tag.outputs.image_tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Azure (ACR)
        if: vars.REGISTRY == 'acr'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: ACR login
        if: vars.REGISTRY == 'acr'
        run: |
          ACR_NAME=$(echo "${{ vars.FRONTEND_REGISTRY_PATH }}" | cut -d/ -f1 | cut -d. -f1)
          az acr login --name "${ACR_NAME}"

      - name: Log in to Docker Hub
        if: vars.REGISTRY == 'dockerhub'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GHCR
        if: vars.REGISTRY == 'ghcr'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Generate frontend image tag
        id: tag
        run: |
          IMAGE_TAG="${{ vars.FRONTEND_REGISTRY_PATH }}:${{ github.sha }}"
          echo "image_tag=${IMAGE_TAG}" >> $GITHUB_OUTPUT

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ steps.tag.outputs.image_tag }}
          platforms: linux/amd64


  terraform-backend:
    name: Provision Shared Infrastructure
    runs-on: ubuntu-latest
    needs: build-backend
    outputs:
      key_vault_name: ${{ steps.tf_out.outputs.key_vault_name }}
      tenant_id: ${{ steps.tf_out.outputs.tenant_id }}
      csi_client_id: ${{ steps.tf_out.outputs.csi_client_id }}

    env:
      ARM_USE_OIDC: true
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # ✅ FIXED INIT (critical)
      - name: Terraform Init
        working-directory: backend/terraform
        run: |
          terraform init -input=false -reconfigure \
            -backend-config="resource_group_name=${{ secrets.TF_STATE_RESOURCE_GROUP }}" \
            -backend-config="storage_account_name=${{ secrets.TF_STATE_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=${{ secrets.TF_STATE_CONTAINER }}" \
            -backend-config="key=taskline.terraform.tfstate"

      # ✅ STATE SYNC FIX
      - name: Terraform State Sync
        working-directory: backend/terraform
        run: |
          terraform state pull || true
          terraform refresh -input=false || true

      - name: Terraform Plan
        working-directory: backend/terraform
        run: terraform plan -input=false -out=tfplan

      - name: Terraform Apply
        working-directory: backend/terraform
        run: terraform apply -input=false -auto-approve tfplan

      - name: Export Terraform Outputs
        id: tf_out
        working-directory: backend/terraform
        run: |
          echo "key_vault_name=$(terraform output -raw key_vault_name)" >> "$GITHUB_OUTPUT"
          echo "tenant_id=$(terraform output -raw tenant_id)" >> "$GITHUB_OUTPUT"
          echo "csi_client_id=$(terraform output -raw csi_user_assigned_identity_client_id)" >> "$GITHUB_OUTPUT"


  terraform-frontend:
    name: Validate Frontend Infra
    runs-on: ubuntu-latest
    needs: terraform-backend

    env:
      ARM_USE_OIDC: true
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Terraform Init
        working-directory: frontend/terraform
        run: |
          terraform init -input=false -reconfigure \
            -backend-config="resource_group_name=${{ secrets.TF_STATE_RESOURCE_GROUP }}" \
            -backend-config="storage_account_name=${{ secrets.TF_STATE_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=${{ secrets.TF_STATE_CONTAINER }}" \
            -backend-config="key=taskline-frontend.terraform.tfstate"

      - name: Terraform Plan
        working-directory: frontend/terraform
        run: terraform plan -input=false -out=tfplan

      - name: Terraform Apply
        working-directory: frontend/terraform
        run: terraform apply -input=false -auto-approve tfplan


  deploy-backend:
    name: Deploy Backend to AKS
    runs-on: ubuntu-latest
    needs: [build-backend, terraform-backend]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Get AKS credentials
        run: |
          az aks get-credentials \
            --resource-group ${{ vars.TF_VAR_resource_group_name }} \
            --name ${{ vars.TF_VAR_aks_cluster_name }} \
            --overwrite-existing

      - name: Update image in manifest
        run: |
          sed -i "s|REGISTRY_IMAGE_PLACEHOLDER|${{ needs.build-backend.outputs.image_tag }}|g" \
            backend/k8s/aks/deployment.yaml

      - name: Deploy backend
        run: |
          kubectl apply -f backend/k8s/aks/service.yaml
          kubectl apply -f backend/k8s/aks/deployment.yaml

      - name: Wait rollout
        run: kubectl rollout status deployment/taskline-backend --timeout=180s


  deploy-frontend:
    name: Deploy Frontend to AKS
    runs-on: ubuntu-latest
    needs: [build-frontend, deploy-backend, terraform-frontend]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Get AKS credentials
        run: |
          az aks get-credentials \
            --resource-group ${{ vars.TF_VAR_resource_group_name }} \
            --name ${{ vars.TF_VAR_aks_cluster_name }} \
            --overwrite-existing

      - name: Update frontend image
        run: |
          sed -i "s|FRONTEND_IMAGE_PLACEHOLDER|${{ needs.build-frontend.outputs.image_tag }}|g" \
            frontend/k8s/aks/deployment.yaml

      - name: Deploy frontend
        run: |
          kubectl apply -f frontend/k8s/aks/configmap.yaml
          kubectl apply -f frontend/k8s/aks/service.yaml
          kubectl apply -f frontend/k8s/aks/deployment.yaml

      - name: Wait rollout
        run: kubectl rollout status deployment/taskline-frontend --timeout=120s
      - name: Get frontend external IP
        run: |
          echo "Waiting for external IP..."
          for i in {1..20}; do
            IP=$(kubectl get svc taskline-frontend-service \
              -o jsonpath='{.status.loadBalancer.ingress[0].ip}' 2>/dev/null)
            if [ -n "$IP" ]; then
              echo "Frontend is live at: http://${IP}"
              break
            fi
            echo "Still waiting... (${i}/20)"
            sleep 15
          done
